substitutions:
  name: "mypanel-woonkamer-sdl2"

packages:
  settings: !include settings.yaml

  # for simulation turn on device_sdl and turn off device_base
  device_base: !include packages/display_base.yaml
  #device_sdl: !include packages/display_sdl.yaml
  common_code: !include 
    file: packages/common_code.yaml  
    vars:
      name: "${name}"
      friendly_name: "${friendly_name}" 
  start_page: !include 
    file: packages/startscherm.yaml

  room_page: !include 
    file: packages/studeerkamer.yaml

  woon_page: !include 
    file: packages/woonkamer.yaml

  keuken_page: !include 
    file: packages/keuken.yaml

  kluskamer_page: !include
    file: packages/kluskamer.yaml

  weather_page: !include
    file: packages/weather.yaml

  energy_page: !include
    file: packages/energy.yaml

  train_page: !include
    file: packages/train.yaml

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus    

lvgl:
  top_layer:
    widgets:
    - obj: # kopbalk
        styles: header_footer
        text_font: roboto16
        height: 30
        pad_all: 0
        pad_left: 12
        pad_right: 12
        scrollbar_mode: "OFF"
        align: top_left
        widgets:
          - label:
              align: right_mid
              text_font: roboto20
              text_color: 0x8792A8
              text: "\U000F05A9"
              id: lbl_hastatus
              hidden: true
          - label:
              align: left_mid
              id: title_time
              text: "00:00"
          - label:
              align_to:
                id: title_time
                align: out_right_mid
                x: 6
              text_font: roboto20
              id: stookwijzer_label
              text: "\U000F0238"
          - label: # chip: "Morgen <afval>"
              align_to:
                id: stookwijzer_label
                align: out_right_mid
                x: 10
              id: afval_label2
              text_font: roboto14
              text_color: 0x8792A8
              text: "Morgen"
          - label:
              align_to:
                id: afval_label2
                align: out_right_mid
                x: 6
              id: afval_label
              text_font: roboto14
              text_color: 0xBFE8B8
              bg_color: 0x2F4D2F
              bg_opa: COVER
              radius: 10
              pad_left: 8
              pad_right: 8
              pad_top: 1
              pad_bottom: 1
              text: ""

    - buttonmatrix: # navigatie; actieve pagina wordt gezet door script nav_actief
        id: nav_matrix
        align: bottom_mid
        styles: header_footer
        rows:
           - buttons:
              - id: page_home
                text: "\U000F02DC"
                on_press:
                  then:
                    lvgl.page.show: start_page
              - id: page_woonkamer
                text: "\U000F04B9"
                on_press:
                  then:
                    lvgl.page.show: woonkamer_page
              - id: page_keuken
                text: "\U000F04DE"
                on_press:
                  then:
                    lvgl.page.show: keuken_page
              - id: page_studeerkamer
                text: "\U000F095F"
                on_press:
                  then:
                    lvgl.page.show: studeer_page
              - id: page_kluskamer
                text: "${hammerscrewdriver}"
                on_press:
                  then:
                    lvgl.page.show: kluskamer_page

    - obj: # onzichtbare laag over het hele scherm; vangt de eerste tik op een gedimd scherm af
        id: wake_overlay
        align: top_left
        width: 480
        height: 480
        bg_opa: TRANSP
        border_width: 0
        radius: 0
        pad_all: 0
        hidden: true

time:
  - platform: homeassistant
    id: time_comp
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: '0'
        then:
          - script.execute: time_update

script:
# Actieve knop in de navigatiebalk: 0 = home .. 4 = kluskamer, -1 = geen
  - id: nav_actief
    parameters:
      knop: int
    then:
      - lambda: |-
          lv_buttonmatrix_clear_button_ctrl_all(id(nav_matrix)->obj, LV_BUTTONMATRIX_CTRL_CHECKED);
          if (knop >= 0)
            lv_buttonmatrix_set_button_ctrl(id(nav_matrix)->obj, knop, LV_BUTTONMATRIX_CTRL_CHECKED);

# Time update
  - id: time_update
    then:
      - lvgl.label.update:
          id: title_time
          text: !lambda |-
            static char time_buf[10];
            auto now = id(time_comp).now();
            snprintf(time_buf, sizeof(time_buf), "%2d:%02d ", now.hour, now.minute );
            return time_buf;      

text_sensor:    
  - platform: homeassistant
    id: sensor_stookwijzer
    entity_id: ${sensor_stookwijzer}
    on_value:
      - lambda: |-
          // geel / oranje / rood; grijs bij unknown of unavailable
          uint32_t kleur = 0x8F8F8F;
          if (x == "code_yellow") kleur = 0xFFD600;
          else if (x == "code_orange") kleur = 0xFF8C00;
          else if (x == "code_red") kleur = 0xFF3000;
          lv_obj_set_style_text_color(id(stookwijzer_label), lv_color_hex(kleur), LV_PART_MAIN);

# afvalinfo: wat wordt er morgen opgehaald
  - platform: homeassistant
    id: sensor_afval
    entity_id: ${sensor_afval_morgen}
    on_value:
      - if:
          condition:
            lambda: |-
              return x == "geen";
#             return (0 == x.compare(std::string{"geen"}));
          then:
            - lvgl.widget.hide: afval_label
            - lvgl.widget.hide: afval_label2
            
          else:
            - lvgl.label.update:
                id: afval_label
                text: !lambda 'return x.c_str();'
            - lvgl.widget.show: afval_label
            - lvgl.widget.show: afval_label2
