substitutions:
  play_pause_icon: "\U000F040E"
  mute_icon: "\U000F075F"
  volume_icon: "\U000F057F"
  powerbutton: "\U000F0906"
  home: "\U000F02DC"
  desklamp: "\U000F095F"
  stove: "\U000F04DE"
  hammerscrewdriver: "\U000F1322"
  countertop: "\U000F181C"
  sofa: "\U000F04B9"

  radio_url_stubru: "x-rincon-mp3radio://http://icecast.vrtcdn.be/stubru.aac"
  radio_url_pinguin: "http://streams.pinguinradio.com/PinguinClassics192.mp3"


esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

# Enable logging
logger:

# LVGL configuration
lvgl:

  # Palet
  #   achtergrond 0x10141D  kaart 0x1B2333  knop 0x263049  knop ingedrukt 0x324064
  #   balken 0x0B0E15  tekst 0xE9EDF4  gedempt 0x8792A8  accent (aan/actief) 0xF4B740
  radius: 0
  bg_color: 0x10141D
  style_definitions:
    - id: bg_white # kaart
      text_font: roboto20
      bg_color: 0x1B2333
      border_color: 0x1B2333
      border_width: 0
      radius: 12
      text_color: 0xE9EDF4
      scrollbar_mode: "OFF"
    - id: card_title # titel linksboven in een kaart
      text_font: roboto14
      text_color: 0x8792A8
      align: top_left
      y: -6
    - id: card_value # waarde rechtsboven in een kaart
      text_font: roboto16
      text_color: 0xE9EDF4
      align: top_right
      y: -7
    - id: header_footer
      text_font: mdi24
      bg_color: 0x0B0E15
      text_color: 0xE9EDF4
      width: 100%
      height: 50
      border_color: 0x0B0E15
      border_width: 0
      radius: 0
      shadow_width: 0

  theme:
    button:
      bg_color: 0x263049
      radius: 10
      shadow_width: 0
      border_width: 0
      text_color: 0xE9EDF4
      pressed: # set some button colors to be different in pressed state
        bg_color: 0x324064
        text_color: 0xE9EDF4
      checked: # lamp of schakelaar staat aan
        bg_color: 0xF4B740
        text_color: 0x2A1D00
      disabled: # apparaat niet bereikbaar
        bg_color: 0x1B2333
        border_color: 0x263049
        border_width: 1
        text_color: 0x4A5368
    buttonmatrix:
      bg_color: 0x0B0E15
      pad_all: 0
      pad_column: 0
      border_width: 0
      items:
        bg_color: 0x0B0E15
        radius: 0
        height: 50
        shadow_width: 0
        border_width: 0
        text_color: 0x8792A8
        text_font: mdi24
        pressed: # set some button colors to be different in pressed state
          bg_color: 0x151B29
          text_color: 0xE9EDF4
        checked: # actieve pagina
          bg_color: 0x151B29
          text_color: 0xF4B740
    slider:
      bg_color: 0x263049
      indicator:
        bg_color: 0xE9EDF4
      knob:
        bg_color: 0xE9EDF4
        pad_all: 2
    bar:
      bg_color: 0x324064
      bg_opa: COVER
      radius: 5
      indicator:
        bg_color: 0xF4B740
        bg_opa: COVER
        radius: 5



  page_wrap: true


