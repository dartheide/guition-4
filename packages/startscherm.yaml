# LVGL configuration
lvgl:
  pages:
    - id: start_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 0
      widgets:
        - obj: # Weer (gevuld door weather.yaml)
            x: 10
            y: 40
            width: 280
            height: 150
            pad_all: 10
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text_font: weather_icons
                  id: home_weather_icon_now
                  align: top_left
                  text: "\U000F0599"
              - label:
                  text_font: roboto32
                  align: top_left
                  x: 68
                  y: -2
                  id: forecast_temperature_current_high
                  text: "-"
              - label:
                  text_font: roboto16
                  text_color: 0x8792A8
                  align: top_left
                  x: 70
                  y: 38
                  id: forecast_temperature_current_low
                  text: ""
              - label:
                  text_font: roboto16
                  text_color: 0x8792A8
                  align: top_left
                  x: 150
                  y: 38
                  id: label_uv_index_now
                  text: ""
              - label:
                  text_font: roboto16
                  align: bottom_left
                  y: -22
                  width: 260
                  long_mode: DOT
                  id: text_weather_condition_now
                  text: ""
              - label:
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: bottom_left
                  id: weer_morgen
                  text: ""
            on_press:
              then:
                lvgl.page.show: weather_page

        - obj: # Net nu (gevuld door script update_net_nu in energy.yaml)
            x: 300
            y: 40
            width: 170
            height: 150
            pad_all: 10
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  styles: card_title
                  text: "Net nu"
              - label:
                  id: start_net_nu
                  text_font: roboto32
                  align: top_left
                  y: 14
                  text: "- W"
              - label:
                  id: start_net_tekst
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: top_left
                  y: 54
                  text: ""
              - bar:
                  id: start_net_bar
                  mode: SYMMETRICAL
                  align: top_left
                  y: 82
                  width: 150
                  height: 8
                  min_value: -3000
                  max_value: 3000
                  value: 0
              - obj: # nulstreep midden in de balk
                  align: top_left
                  x: 74
                  y: 77
                  width: 2
                  height: 18
                  radius: 1
                  border_width: 0
                  pad_all: 0
                  bg_color: 0xE9EDF4
              - label:
                  id: start_zon
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: bottom_left
                  text: ""
            on_press:
              then:
                lvgl.page.show: energy_page

        - obj: # Treinlijst: tijd in eigen kolom, bestemming ernaast (gevuld door script vertrek_regel)
            x: 10
            y: 200
            width: 460
            height: 150
            pad_all: 10
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  styles: card_title
                  text: "Vertrek"
              - label:
                  text_font: mdi24
                  text_color: 0x8792A8
                  text: "\U000F052C" # train
                  align: top_right
                  y: -8
              - label: { id: text_ns_1_tijd, text: "", align: top_left, y: 22 }
              - label: { id: text_ns_1, text: "-", align: top_left, x: 66, y: 22, width: 374, long_mode: DOT }
              - label: { id: text_ns_2_tijd, text: "", align: top_left, y: 50 }
              - label: { id: text_ns_2, text: "-", align: top_left, x: 66, y: 50, width: 374, long_mode: DOT }
              - label: { id: text_ns_3_tijd, text: "", align: top_left, y: 78 }
              - label: { id: text_ns_3, text: "-", align: top_left, x: 66, y: 78, width: 374, long_mode: DOT }
              - label:
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: bottom_left
                  y: 4
                  text: "Tik voor alle vertrekken"
            on_press:
              then:
                lvgl.page.show: ns_page

        # Scènes
        - button:
            x: 10
            y: 360
            width: 107
            height: 56
            widgets:
              - label:
                  text_font: roboto16
                  text: "\U000F0FCE Film"
                  align: center
            on_press:
              then:
                - homeassistant.action:
                    action: script.film
        - button:
            x: 127
            y: 360
            width: 107
            height: 56
            widgets:
              - label:
                  text_font: roboto16
                  text: "\U000F02E3 Naar bed"
                  align: center
            on_press:
              then:
                - homeassistant.action:
                    action: script.naar_bed
        - button:
            x: 244
            y: 360
            width: 107
            height: 56
            widgets:
              - label:
                  text_font: roboto16
                  text: "\U000F0A28 Weg"
                  align: center
            on_press:
              then:
                - homeassistant.action:
                    action: script.weg
        - button:
            x: 361
            y: 360
            width: 109
            height: 56
            widgets:
              - label:
                  text_font: roboto16
                  text: "\U000F0336 Alles uit"
                  align: center
            on_press:
              then:
                - homeassistant.action:
                    action: script.alle_lichten_uit

binary_sensor:
  - platform: status
    name: Status sensor

sensor:
  - platform: homeassistant
    id: sensor_sum_power_total
    entity_id: sensor.sum_power_total
    internal: true
    on_value:
      - script.execute:
          id: update_net_nu
          w: !lambda return x;
