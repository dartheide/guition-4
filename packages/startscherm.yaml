# LVGL configuration
lvgl:
  pages:
    - id: start_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 0
      widgets:
        - obj: # Weer
            x: 10
            y: 40
            width: 225
            height: 150
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  text_font: weather_icons
                  id: home_weather_icon_now
                  align: top_left
                  text: "\U000F0599"
              - label:
                  text_font: roboto20
                  align: top_right
                  y: 2
                  id: forecast_temperature_current_high
                  text: "-"
              - label:
                  text_font: roboto20
                  align: top_right
                  y: 30
                  text_color: 0x8792A8
                  id: forecast_temperature_current_low
                  text: "-"
              - label:
                  text_font: roboto16
                  align: bottom_left
                  y: -20
                  width: 205
                  long_mode: DOT
                  id: text_weather_condition_now
                  text: ""
              - label:
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: bottom_left
                  id: label_uv_index_now
                  text: "-"
            on_press:
                then:
                  lvgl.page.show: weather_page

        - obj: # Energiescherm
            x: 245
            y: 40
            width: 225
            height: 150
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - meter:
                  height: 120
                  width: 205
                  border_width: 0
                  bg_opa: TRANSP
                  align: CENTER
                  scales:
                    - range_from: -2000
                      range_to: 2000
                      angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                      ticks: # minimaal 2 verplicht; onzichtbaar gemaakt
                        count: 2
                        width: 0
                        length: 0
                      indicators:
                        - line:
                            id: val_needle
                            width: 6
                            color: 0xE9EDF4
                            r_mod: 12 # sets line length by this much difference from the scale default radius
                            value: 0
                        - arc: # teruglevering
                            color: 0x4CC38A # groen
                            r_mod: 10 # radius difference from the scale default radius
                            width: 20
                            start_value: -2000
                            end_value: 0
                        - arc: # afname
                            color: 0xEF5D4E # rood
                            r_mod: 10
                            width: 20
                            start_value: 0
                            end_value: 2000

              - obj: # to cover the middle part of meter indicator line
                  radius: 70
                  styles: bg_white
                  pad_all: 0
                  align: CENTER
                  y: 40
                  on_press:
                    then:
                      lvgl.page.show: energy_page

              - label: # gauge numeric indicator
                  id: val_text
                  text_font: roboto20
                  align: bottom_mid
                  y: -20
                  text: 0
                  on_press:
                    then:
                      lvgl.page.show: energy_page

              - label: #
                  text_font: roboto14
                  text_color: 0x8792A8
                  align: bottom_mid
                  y: 10
                  text: Net
                  on_press:
                    then:
                      lvgl.page.show: energy_page
            on_press:
                then:
                  lvgl.page.show: energy_page

        - obj: # Treinlijst: tijd in eigen kolom, bestemming ernaast (gevuld door script vertrek_regel)
            x: 10
            y: 200
            width: 460
            height: 160
            pad_all: 10
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  styles: card_title
                  text: "Vertrek"
              - label:
                  text_font: mdi24
                  text_color: 0x8792A8
                  text: "\U000F052C" # train
                  align: top_right
                  y: -8
              - label: { text_font: roboto16, id: text_ns_1_tijd, text: "", align: top_left, y: 22 }
              - label: { text_font: roboto16, id: text_ns_1, text: "-", align: top_left, x: 56, y: 22, width: 384, long_mode: DOT }
              - label: { text_font: roboto16, id: text_ns_2_tijd, text: "", align: top_left, y: 46 }
              - label: { text_font: roboto16, id: text_ns_2, text: "-", align: top_left, x: 56, y: 46, width: 384, long_mode: DOT }
              - label: { text_font: roboto16, id: text_ns_3_tijd, text: "", align: top_left, y: 70 }
              - label: { text_font: roboto16, id: text_ns_3, text: "-", align: top_left, x: 56, y: 70, width: 384, long_mode: DOT }
              - label: { text_font: roboto16, id: text_ns_4_tijd, text: "", align: top_left, y: 94 }
              - label: { text_font: roboto16, id: text_ns_4, text: "-", align: top_left, x: 56, y: 94, width: 384, long_mode: DOT }
              - label: { text_font: roboto16, id: text_ns_5_tijd, text: "", align: top_left, y: 118 }
              - label: { text_font: roboto16, id: text_ns_5, text: "-", align: top_left, x: 56, y: 118, width: 384, long_mode: DOT }
            on_press:
              then:
                lvgl.page.show: ns_page

        - obj: # Scènes
            x: 10
            y: 370
            width: 460
            height: 50
            pad_all: 5
            styles: bg_white
            scrollbar_mode: "OFF"
            widgets:
              - button:
                    id: scene_film
                    align: left_mid
                    width: 100
                    height: 40
                    widgets:
                      - label:
                          text_font: roboto16
                          text: "\U000F0FCE Film"
                          align: center
                    on_press:
                      then:
                        - homeassistant.action:
                            action: script.film
              - button:
                    id: scene_naar_bed
                    align: left_mid
                    x: 106
                    width: 110
                    height: 40
                    widgets:
                      - label:
                          text_font: roboto16
                          text: "\U000F02E3 Naar bed"
                          align: center
                    on_press:
                      then:
                        - homeassistant.action:
                            action: script.naar_bed
              - button:
                    id: scene_weg
                    align: left_mid
                    x: 222
                    width: 90
                    height: 40
                    widgets:
                      - label:
                          text_font: roboto16
                          text: "\U000F0A28 Weg"
                          align: center
                    on_press:
                      then:
                        - homeassistant.action:
                            action: script.weg
              - button:
                    id: start_lamp1
                    align: right_mid
                    width: 132
                    height: 40
                    widgets:
                      - label:
                          text_font: roboto16
                          id: start_lamp1_label
                          text: "\U000F0336 Lichten uit"
                          align: center
                    on_press:
                      then:
                        - homeassistant.action:
                            action: script.alle_lichten_uit

binary_sensor:
  - platform: status
    name: Status sensor

sensor:
  - platform: homeassistant
    id: sensor_sum_power_total
    entity_id: sensor.sum_power_total
    internal: true
    on_value:
      - lvgl.indicator.update:
          id: val_needle
          value: !lambda return x;
      - lvgl.label.update:
          id: val_text
          text:
            format: "%.0f W"
            args: [ 'x' ]
