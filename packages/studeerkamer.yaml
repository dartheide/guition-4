packages:
  mediaplayer_studeerkamer: !include { file: ../modules/sonos/mediaplayersensors.yaml, vars: {id: studeerkamer, entity_id: "${media_studeerkamer}" }}
  cover1: !include { file: ../modules/cover/co_sensor.yaml, vars: {id: studeerkamer, entity_id: "${gordijn_studeerkamer}" }}
  temp1: !include { file: ../modules/temp/airco_sensor.yaml, vars: {id: studeerkamer, entity_id: "${klimaat_studeerkamer}" }}


# LVGL configuration
lvgl:
  pages:
    - id: studeer_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 3
      widgets:
        - obj: !include { file: ../modules/sonos/mediaplayer.yaml, vars: {id: studeerkamer, entity_id: "${media_studeerkamer}" }}
                                               
        - obj: # Lampen
            x: 10
            y: 180
            width: 460
            height: 90
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  styles: card_title
                  text: "Lampen"

              - button:  # Nieuw: Bureau-knop met dynamische tekst
                  id: desk_toggle
                  align: bottom_right
                  width: 140
                  height: 44
                  widgets:
                    - label:
                        id: desk_label
                        text: "\U000F1239 Bureau..."
                        align: left_mid
                  on_press:
                    - homeassistant.action:
                          action: cover.set_cover_position
                          data:
                            position: !lambda |-
                              return (id(desk_position).state == 23) ? 82 : 23;
                            entity_id: ${bureau_studeerkamer}

        - obj: !include { file: ../modules/cover/gui_cover.yaml, vars: {id: studeerkamer, entity_id: "${gordijn_studeerkamer}", title: "Rolgordijnen", x: 10 }}

        - obj: !include { file: ../modules/temp/gui_airco.yaml, vars: {id: studeerkamer, entity_id: "${klimaat_studeerkamer}" }}

sensor:
  - platform: homeassistant
    entity_id: ${bureau_studeerkamer}
    attribute: current_position
    id: desk_position
    on_value:
      - lambda: |-
          if (id(desk_position).state <= 23) {
              lv_label_set_text(id(desk_label), ("\U000F1239 Omhoog"));
          } else if (id(desk_position).state >= 82) {
              lv_label_set_text(id(desk_label), ("\U000F1239 Omlaag"));
          } else {
              lv_label_set_text(id(desk_label), ("\U000F1239 Bezig..."));
          }


