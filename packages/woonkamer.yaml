substitutions:
  pagina: "woonkamer"

packages:
  mediaplayer_woonkamer: !include { file: ../modules/sonos/mediaplayersensors.yaml, vars: {id: woonkamer, entity_id: "${media_woonkamer}" }}
  lamp1: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: kamer, entity_id: "${licht_woonkamer}" }}
  lamp2: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: erker, entity_id: "${licht_erker}" }}
  lamp3: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: plafond, entity_id: "${licht_plafond_woonkamer}" }}
  cover1: !include { file: ../modules/cover/co_sensor.yaml, vars: {id: erker, entity_id: "${gordijn_erker}" }}
  temp1: !include { file: ../modules/temp/temp_sensor.yaml, vars: {id: woonkamer, entity_id: "${klimaat_woonkamer}" }}

# LVGL configuration
lvgl:
  pages:
    - id: ${pagina}_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 1
      widgets:
        - obj: !include { file: ../modules/sonos/mediaplayer.yaml, vars: {id: woonkamer, entity_id: "${media_woonkamer}" }}
                                          
        - obj: # Lampen
            x: 10
            y: 180
            width: 460
            height: 90
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  styles: card_title
                  text: "Lampen"
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: kamer, entity_id: "${licht_woonkamer}", pos: bottom_left }}                                    
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: erker, entity_id: "${licht_erker}", pos: bottom_mid }}
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: plafond, entity_id: "${licht_plafond_woonkamer}", pos: bottom_right }}
              
        - obj: !include { file: ../modules/cover/gui_cover.yaml, vars: {id: erker, entity_id: "${gordijn_erker}", title: "Gordijnen Erker", x: 10 }}

        - obj: !include { file: ../modules/temp/gui_temp.yaml, vars: {id: woonkamer, entity_id: "${klimaat_woonkamer}" }}
