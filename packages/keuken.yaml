packages:
  mediaplayer_keuken: !include { file: ../modules/sonos/mediaplayersensors.yaml, vars: {id: keuken, entity_id: "${media_keuken}" }}
  lamp1: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: eettafel, entity_id: "${licht_eettafel}" }}
  lamp2: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: aanrecht, entity_id: "${licht_aanrecht}" }}
  lamp3: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: spotjes, entity_id: "${licht_keukenspotjes}" }}
  cover1: !include { file: ../modules/cover/co_sensor.yaml, vars: {id: klapdeur, entity_id: "${gordijn_klapdeur}" }}
  cover2: !include { file: ../modules/cover/co_sensor.yaml, vars: {id: keuken, entity_id: "${gordijn_keuken}" }}

# LVGL configuration
lvgl:
  pages:
    - id: keuken_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 2
      widgets:
        - obj: !include { file: ../modules/sonos/mediaplayer.yaml, vars: {id: keuken, entity_id: "${media_keuken}" }}
                                          
        - obj: 
            x: 10
            y: 180
            width: 460
            height: 90
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  styles: card_title
                  text: "Lampen"
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: eettafel, entity_id: "${licht_eettafel}", pos: bottom_left }}
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: aanrecht, entity_id: "${licht_aanrecht}", pos: bottom_mid }}
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: spotjes, entity_id: "${licht_keukenspotjes}", pos: bottom_right }}

        - obj: !include { file: ../modules/cover/gui_cover.yaml, vars: {id: klapdeur, entity_id: "${gordijn_klapdeur}", title: "Gordijnen eettafel", x: 10 }}
        - obj: !include { file: ../modules/cover/gui_cover.yaml, vars: {id: keuken, entity_id: "${gordijn_keuken}", title: "Gordijnen keuken", x: 245 }}
