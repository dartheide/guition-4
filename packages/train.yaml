
# LVGL configuration
lvgl:
  pages:
    - id: ns_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: -1
      widgets:
        - obj: # achtergrond
            x: 10
            y: 40
            width: 460
            height: 375
            styles: bg_white
            widgets:
              - label:
                  text_font: weather_icons
                  text: "\U000F052C" # train 
                  align: left_mid            
              - label:
                  text_font: roboto20
                  id: text_train_1
                  text: "-"
                  align: top_left
                  x: 75
              - label:
                  text_font: roboto20
                  id: text_train_2
                  text: "-"
                  align: top_left
                  x: 75
                  y: 30
              - label:
                  text_font: roboto20
                  id: text_train_3
                  text: "-"
                  align: top_left
                  x: 75
                  y: 60
              - label:
                  text_font: roboto20
                  id: text_train_4
                  text: "-"
                  align: top_left
                  x: 75
                  y: 90
              - label:
                  text_font: roboto20
                  id: text_train_5
                  text: "-"
                  align: top_left
                  x: 75
                  y: 120
            on_press:
                then:
                  lvgl.page.show: start_page

text_sensor:
  - platform: homeassistant
    id: ns_departure1
    entity_id: sensor.ns_departure_1
    on_value:
      # Update startscherm: tijd en bestemming apart
      - script.execute:
          id: vertrek_regel
          nr: 1
          tekst: !lambda 'return x;'
      # Update train page label
      - lvgl.label.update:
          id: text_train_1
          text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: ns_departure2
    entity_id: sensor.ns_departure_2
    on_value:
      # Update startscherm: tijd en bestemming apart
      - script.execute:
          id: vertrek_regel
