packages:
  mediaplayer_kluskamer: !include { file: ../modules/sonos/mediaplayersensors.yaml, vars: {id: kluskamer }}
  lamp1: !include { file: ../modules/lamp/groeplamp_sensor.yaml, vars: {id: badkamer, entity_id: light.ikea_of_sweden_gunnarp_panel_40_40_light }}
  switch1: !include { file: ../modules/switch/schakelaar_sensor.yaml, vars: {id: deken_hans, entity_id: light.ikea_of_sweden_tradfri_control_outlet_switch_4 }}
  cover1: !include { file: ../modules/cover/co_sensor.yaml, vars: {id: kluskamer, entity_id: cover.plisse_kluskamer }}
  temp1: !include { file: ../modules/temp/temp_sensor.yaml, vars: {id: kluskamer, entity_id: climate.bosch_radiatorkraan_kluskamer_thermostat }}
  
# LVGL configuration
lvgl:
  pages:
    - id: kluskamer_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: 4
      widgets:
        - obj: !include { file: ../modules/sonos/mediaplayer.yaml, vars: {id: kluskamer }}
                                               
        - obj: # Lampen
            x: 10
            y: 180
            width: 460
            height: 90
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  styles: card_title
                  text: "Lampen"
              - button: !include { file: ../modules/knop/licht.yaml, vars: {id: badkamer, entity_id: light.ikea_of_sweden_gunnarp_panel_40_40_light, pos: bottom_left }}                                    
              - button: !include { file: ../modules/knop/schakelaar.yaml, vars: {id: deken_hans, entity_id: light.ikea_of_sweden_tradfri_control_outlet_switch_4, pos: bottom_mid }}                                    
                                  
        - obj: !include { file: ../modules/cover/gui_cover.yaml, vars: {id: kluskamer, entity_id: cover.plisse_kluskamer, title: "Gordijnen kluskamer", x: 10 }}


        - obj: !include { file: ../modules/temp/gui_temp.yaml, vars: {id: kluskamer, entity_id: climate.bosch_radiatorkraan_kluskamer_thermostat }}
