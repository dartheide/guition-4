# Weerpagina: vandaag bovenaan, daaronder 4 dagen.
# Alle waarden lopen via script weer_waarde, dat ook het startscherm vult.

packages:
  weer_dag0: !include { file: ../modules/weer/dag_sensors.yaml, vars: { n: 0, cond: weather_condition_now }}
  weer_dag1: !include { file: ../modules/weer/dag_sensors.yaml, vars: { n: 1, cond: weather_condition_1 }}
  weer_dag2: !include { file: ../modules/weer/dag_sensors.yaml, vars: { n: 2, cond: weather_condition_2 }}
  weer_dag3: !include { file: ../modules/weer/dag_sensors.yaml, vars: { n: 3, cond: weather_condition_3 }}

# LVGL configuration
lvgl:
  pages:
    - id: weather_page
      styles: bg_white
      on_load:
        - script.execute:
            id: nav_actief
            knop: -1
      widgets:
        - obj: # Weer van nu
            x: 10
            y: 40
            width: 460
            height: 110
            pad_all: 10
            styles: bg_white
            widgets:
              - label:
                  text_font: weather_icons
                  id: weer_nu_icon
                  text: "-"
                  align: left_mid
              - label:
                  id: weer_nu_tekst
                  text: "-"
                  align: top_left
                  x: 70
                  y: 14
                  width: 220
                  long_mode: DOT
              - label:
                  id: weer_nu_uv
                  text_font: roboto16
                  text_color: 0x8792A8
                  text: ""
                  align: top_left
                  x: 70
                  y: 48
              - label:
                  id: weer_nu_hoog
                  text: "-"
                  align: top_right
                  y: 14
              - label:
                  id: weer_nu_laag
                  text_color: 0x8792A8
                  text: "-"
                  align: top_right
                  y: 46
            on_press:
                then:
                  lvgl.page.show: start_page

        - obj: !include { file: ../modules/weer/dag.yaml, vars: { n: 0, x: 10 }}
        - obj: !include { file: ../modules/weer/dag.yaml, vars: { n: 1, x: 127 }}
        - obj: !include { file: ../modules/weer/dag.yaml, vars: { n: 2, x: 244 }}
        - obj: !include { file: ../modules/weer/dag.yaml, vars: { n: 3, x: 361 }}

script:
  # Zet één waarde (veld) voor dag 0..3 op de weerpagina.
  # Dag 0 vult ook het startscherm en de kaart "vandaag"; hoog van dag 1 wordt "Morgen".
  - id: weer_waarde
    mode: queued
    max_runs: 30
    parameters:
      day: int
      veld: string
      waarde: string
    then:
      - lambda: |-
          if (day < 0 || day > 3) return;
          lv_obj_t *dag[] = {id(text_dag_0), id(text_dag_1), id(text_dag_2), id(text_dag_3)};
          lv_obj_t *uv[] = {id(text_uv_index_0), id(text_uv_index_1), id(text_uv_index_2), id(text_uv_index_3)};
          lv_obj_t *hoog[] = {id(text_temperature_high_0), id(text_temperature_high_1), id(text_temperature_high_2), id(text_temperature_high_3)};
          lv_obj_t *laag[] = {id(text_temperature_low_0), id(text_temperature_low_1), id(text_temperature_low_2), id(text_temperature_low_3)};
          lv_obj_t *icoon[] = {id(home_weather_icon_0), id(home_weather_icon_1), id(home_weather_icon_2), id(home_weather_icon_3)};
          const char *w = waarde.c_str();
          char buf[32];

          if (veld == "dag") {
            lv_label_set_text(dag[day], w);
          } else if (veld == "uv") {
            snprintf(buf, sizeof(buf), "uv %s", w);
            lv_label_set_text(uv[day], buf);
          } else if (veld == "hoog") {
            snprintf(buf, sizeof(buf), "\U000F10C2 %s°", w);
            lv_label_set_text(hoog[day], buf);
            if (day == 0) {
              lv_label_set_text(id(weer_nu_hoog), buf);
              snprintf(buf, sizeof(buf), "%s°", w);
              lv_label_set_text(id(forecast_temperature_current_high), buf);
            } else if (day == 1) {
              snprintf(buf, sizeof(buf), "Morgen %s°", w);
              lv_label_set_text(id(weer_morgen), buf);
            }
          } else if (veld == "laag") {
            snprintf(buf, sizeof(buf), "\U000F10C3 %s°", w);
            lv_label_set_text(laag[day], buf);
            if (day == 0) {
              lv_label_set_text(id(weer_nu_laag), buf);
              snprintf(buf, sizeof(buf), "min %s°", w);
              lv_label_set_text(id(forecast_temperature_current_low), buf);
            }
          } else if (veld == "weer") {
            // weertype -> MDI-icoon en Nederlandse tekst
            struct Weer { const char *naam, *icoon, *tekst; };
            static const Weer tabel[] = {
              {"sunny",               "\U000F0599", "Zonnig"},
              {"clear-night",         "\U000F0594", "Heldere nacht"},
              {"partlycloudy",        "\U000F0595", "Gedeeltelijk bewolkt"},
              {"night-partly-cloudy", "\U000F0F31", "Gedeeltelijk bewolkt"},
              {"cloudy",              "\U000F0590", "Bewolkt"},
              {"rainy",               "\U000F0597", "Regenachtig"},
              {"pouring",             "\U000F0596", "Stortregen"},
              {"lightning",           "\U000F0593", "Onweer"},
              {"lightning-rainy",     "\U000F067E", "Onweer en regen"},
              {"snowy",               "\U000F0598", "Sneeuw"},
              {"snowy-rainy",         "\U000F067F", "Natte sneeuw"},
              {"hail",                "\U000F0592", "Hagel"},
              {"fog",                 "\U000F0591", "Mistig"},
              {"windy",               "\U000F059D", "Winderig"},
              {"windy-variant",       "\U000F059E", "Winderig"},
              {"exceptional",         "\U000F0F2F", "Uitzonderlijk"},
            };
            const char *ic = "\U000F02D7";  // help-circle (onbekend)
            const char *tekst = "Onbekend";
            for (const auto &r : tabel) {
              if (waarde == r.naam) { ic = r.icoon; tekst = r.tekst; break; }
            }
            lv_label_set_text(icoon[day], ic);
            if (day == 0) {
              lv_label_set_text(id(home_weather_icon_now), ic);
              lv_label_set_text(id(weer_nu_icon), ic);
              lv_label_set_text(id(text_weather_condition_now), tekst);
              lv_label_set_text(id(weer_nu_tekst), tekst);
            }
          }

sensor:
  - platform: homeassistant
    id: uv_index_state_sensor
    entity_id: weather.forecast_home
    attribute: uv_index
    on_value:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "Uv %.0f", x);
          lv_label_set_text(id(label_uv_index_now), buf);
          lv_label_set_text(id(weer_nu_uv), buf);

font:
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: weather_icons
    size: 48
    bpp: 4
    glyphs: [
      "\U000F0594", # clear-night
      "\U000F0590", # cloudy
      "\U000F0F2F", # exceptional
      "\U000F0591", # fog
      "\U000F0592", # hail
      "\U000F0593", # lightning
      "\U000F067E", # lightning-rainy
      "\U000F0595", # partlycloudy
      "\U000F0596", # pouring
      "\U000F0597", # rainy
      "\U000F0598", # snowy
      "\U000F067F", # snowy-rainy
      "\U000F0599", # sunny
      "\U000F059D", # windy
      "\U000F059E", # windy-variant
      "\U000F14E4", # sunny-off
      "\U000F0F31", # mdi-weather-night-partly-cloudy
      "\U000F02D7", # mdi-help-circle
      "\U000F052C", # mdi-train
      ]
