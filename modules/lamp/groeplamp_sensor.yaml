# id:
# entity_id
# aan: knop gevuld in accentkleur (theme 'checked'), uit: gewone knop
text_sensor:
  - platform: homeassistant
    id: remote_light_${id}
    entity_id: ${entity_id}
    on_value:
      - lvgl.widget.update:
          id: ${id}_lamp_btn
          state:
            checked: !lambda 'return x == "on";'
      - lvgl.label.update:
          id: ${id}_lamp_label
          text: !lambda |-
            return std::string(x == "on" ? "\U000F1254 ${id}" : "\U000F0336 ${id}");
