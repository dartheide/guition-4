
id: ${id}_switch_btn
align: ${pos}
width: 140
height: 44
widgets:
  - label:
      text_font: roboto20
      id: ${id}_switch_label
      text: "${id}"
      align: left_mid
on_press:
  then:
    - homeassistant.action:
        action: switch.toggle
        data:
          entity_id: ${entity_id} 
