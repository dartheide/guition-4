# id:
# entity_id
# title
# x: 10 (links) of 245 (rechts)
# gui voor de rolgordijnen

#- obj: # Control card
    x: ${x}
    y: 280
    width: 225
    height: 140
    pad_all: 10
    styles: bg_white
    widgets:
      - label:
          styles: card_title
          text: ${title}
      - label:
          styles: card_value
          id: cov_pos_${id}
          text: "-"
      - bar:
          id: cov_bar_${id}
          align: top_left
          y: 24
          width: 205
          height: 10
          min_value: 0
          max_value: 100
          value: 0
      - button:
          width: 60
          height: 44
          align: bottom_left
          widgets:
          - label:
              id: cov_up_${id}
              text_font: mdi24
              align: CENTER
              text: "\U000F0143"
          on_press:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: ${entity_id}
      - button:
          width: 60
          height: 44
          align: bottom_mid
          widgets:
          - label:
              id: cov_stop_${id}
              text_font: mdi24
              align: CENTER
              text: "\U000F04DB"
          on_press:
            - homeassistant.action:
                action: cover.stop_cover
                data:
                  entity_id: ${entity_id}
      - button:
          width: 60
          height: 44
          align: bottom_right
          widgets:
          - label:
              id: cov_down_${id} 
              text_font: mdi24
              align: CENTER
              text: "\U000F0140"
          on_press:
            - homeassistant.action:
                action: cover.close_cover
                data:
                  entity_id: ${entity_id}
