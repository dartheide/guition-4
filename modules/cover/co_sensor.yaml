# id:
# entity_id

sensor:
  - platform: homeassistant
    id: cover_${id}_pos
    entity_id: ${entity_id}
    attribute: current_position
    on_value:
      - lvgl.bar.update:
          id: cov_bar_${id}
          value: !lambda 'return x;'
      - lvgl.label.update:
          id: cov_pos_${id}
          text:
            format: "%.0f%%"
            args: [ 'x' ]
      - if:
          condition:
            lambda: |-
              return x == 100;
          then:
            - lvgl.widget.update:
                id: cov_up_${id}
                text_opa: 60%
          else:
            - lvgl.widget.update:
                id: cov_up_${id}
                text_opa: 100%
      - if:
          condition:
            lambda: |-
              return x == 0;
          then:
            - lvgl.widget.update:
                id: cov_down_${id}
                text_opa: 60%
          else:
            - lvgl.widget.update:
                id: cov_down_${id}
                text_opa: 100%

text_sensor:
  # Gordijnen: tijdens bewegen "opent..." / "sluit..." rechtsboven, anders de positie
  - platform: homeassistant
    id: cover_${id}_gordijnen
    entity_id: ${entity_id}
    on_value:
      - lvgl.label.update:
          id: cov_pos_${id}
          text: !lambda |-
            static char buf[12];
            if (x == "opening") return "opent...";
            if (x == "closing") return "sluit...";
            snprintf(buf, sizeof(buf), "%.0f%%", id(cover_${id}_pos).get_state());
            return buf;
