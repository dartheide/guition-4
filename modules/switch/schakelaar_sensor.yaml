# id:
# entity_id
# aan: knop gevuld in accentkleur (theme 'checked'), uit: gewone knop
text_sensor:
  - platform: homeassistant
    id: remote_light_${id}
    entity_id: ${entity_id}
    on_value:
      - lvgl.widget.update:
          id: ${id}_switch_btn
          state:
            checked: !lambda 'return x == "on";'
