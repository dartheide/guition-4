#id
# entity_id
#- obj: # Temperatuur
        x: 245
        y: 280
        width: 225
        height: 140
        pad_all: 10
        styles: bg_white
        widgets:
            - label:
                styles: card_title
                text: "Temperatuur"
            - label: # gemeten temperatuur, gezet door temp_sensor.yaml
                styles: card_value
                id: temp_cur_${id}
                text_color: 0x8792A8
                text: "nu -"
            - spinbox:
                id: spinbox_${id}
                align: top_mid
                y: 14
                width: 120
                text_font: roboto32
                text_align: CENTER
                text_color: 0xE9EDF4
                bg_opa: TRANSP
                border_width: 0
                range_from: ${thermostaat_min}
                range_to: ${thermostaat_max}
                selected_digit: 0 # hele graden
                cursor: # geen gekleurd vlak achter het cijfer
                    bg_opa: TRANSP
                    text_color: 0xE9EDF4
                rollover: false
                digits: 2
                decimal_places: 0
                value: 20
                on_value: # versturen gebeurt vertraagd door temp_sensor.yaml
                    then:
                        - script.execute:
                            id: ${id}_temp_zetten
                            temp: !lambda return x;
            - button:
                width: 60
                height: 44
                align: bottom_left
                id: ${id}_spin_down
                on_click:
                    - lvgl.spinbox.decrement: spinbox_${id}
                widgets:
                    - label:
                        text_font: roboto32
                        text: "-"
                        align: center
            - button:
                width: 60
                height: 44
                align: bottom_right
                id: ${id}_spin_up
                on_click:
                    - lvgl.spinbox.increment: spinbox_${id}
                widgets:
                    - label:
                        text_font: roboto32
                        text: "+"
                        align: center
