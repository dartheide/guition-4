#id
# entity_id
#- obj: # Temperatuur
        x: 245
        y: 280
        width: 225
        height: 140
        pad_all: 10
        styles: bg_white
        widgets:
            - label:
                styles: card_title
                text: "Temperatuur"
            - label: # gemeten temperatuur, gezet door temp_sensor.yaml
                styles: card_value
                id: temp_cur_${id}
                text_color: 0x8792A8
                text: "nu -"
            - spinbox:
                id: spinbox_${id}
                align: top_mid
                y: 14
                width: 120
                text_font: roboto32
                text_align: CENTER
                text_color: 0xE9EDF4
                bg_opa: TRANSP
                border_width: 0
                range_from: 21
                range_to: 35
                selected_digit: 0
                rollover: false
                digits: 3
                decimal_places: 1
                value: 22
                on_value:
                    then:
                        - homeassistant.action:
                            action: climate.set_temperature
                            data:
                                temperature: !lambda return x;
                                entity_id: ${entity_id}
            - button:
                width: 60
                height: 44
                align: bottom_left
                id: ${id}_spin_down
                on_click:
                    - lvgl.spinbox.decrement: spinbox_${id}
                widgets:
                    - label:
                        text_font: roboto32
                        text: "-"
                        align: center
            - button:
                width: 60
                height: 44
                align: bottom_right
                id: ${id}_spin_up
                on_click:
                    - lvgl.spinbox.increment: spinbox_${id}
                widgets:
                    - label:
                        text_font: roboto32
                        text: "+"
                        align: center
